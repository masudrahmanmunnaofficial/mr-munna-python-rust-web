[package]
name = "mr-munna-python-rust-web"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlElement", "Storage", "Url", "Blob", "BlobPropertyBag", "Event", "FileReader", "File", "FileList", "HtmlAnchorElement", "History", "Location"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
gloo-net = "0.6"
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "s"
lto = true
